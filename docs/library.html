<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="按学习阶段、CEFR 级别和资源形式浏览逐光英语综合学习资料。" />
    <meta name="robots" content="noindex,follow" />
    <title>综合英语资料库 · 逐光英语</title>
    <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/css/site.css?v=20260826-1" />
  </head>
  <body>
    <div id="site-header"></div>
    <main>
      <section class="catalog-hero">
        <div class="container catalog-hero-grid">
          <div>
            <p class="kicker light">GENERAL ENGLISH · 综合能力成长</p>
            <h1>先按能力分层，<br />再选择合适资料</h1>
            <p>这里不是新增一个笼统的“小学生模块”，而是把资料按起点、能力目标和学习方式组织。年龄只作为参考，当前英语基础才是主要入口。</p>
          </div>
          <div class="catalog-principle">
            <strong>选材顺序</strong>
            <ol>
              <li><span>01</span>判断当前水平</li>
              <li><span>02</span>确认本阶段目标</li>
              <li><span>03</span>选择教材与输入</li>
              <li><span>04</span>跟读、阅读、打卡</li>
            </ol>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-heading">
            <div>
              <p class="kicker">RESOURCE CATALOG · 资料目录</p>
              <h2>找到适合当前阶段的内容</h2>
            </div>
            <p class="section-note" id="catalog-source-status">正在读取资料目录…</p>
          </div>

          <div class="catalog-filters" aria-label="资料筛选">
            <label>
              <span>学习路径</span>
              <select id="track-filter"></select>
            </label>
            <label>
              <span>参考级别</span>
              <select id="level-filter"></select>
            </label>
            <label>
              <span>资源形式</span>
              <select id="format-filter"></select>
            </label>
            <label class="catalog-search">
              <span>搜索系列或技能</span>
              <input id="catalog-search" type="search" placeholder="例如：Power Up、跟读、B1" autocomplete="off" />
            </label>
          </div>

          <div class="catalog-result-bar">
            <strong id="catalog-count">0 项资料</strong>
            <button class="text-button" id="reset-filters" type="button">重置筛选</button>
          </div>
          <div class="catalog-grid" id="catalog-grid" aria-live="polite"></div>
          <p class="copyright-note">版权提示：目录信息可以公开展示；电子书、课程音视频和动画文件只应在你拥有上传与教学使用授权时存入私有空间。未确认授权前，本站不提供公开下载。</p>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <noscript><p class="noscript">请启用 JavaScript 以筛选资料目录。</p></noscript>
    <script src="./assets/js/site-shell.js?v=20260826-1"></script>
    <script src="./assets/js/catalog-data.js"></script>
    <script src="./assets/js/supabase-config.js"></script>
    <script src="./assets/js/library.js"></script>
  </body>
</html>
