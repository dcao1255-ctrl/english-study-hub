<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="联系逐光英语，提交网站问题、学习咨询、资料建议或其他反馈。" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://dcao1255-ctrl.github.io/english-study-hub/contact.html" />
    <meta property="og:title" content="联系客服 · 逐光英语" />
    <meta property="og:description" content="通过在线表单向逐光英语提交咨询与反馈。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dcao1255-ctrl.github.io/english-study-hub/contact.html" />
    <title>联系客服 · 逐光英语</title>
    <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/css/site.css?v=20260826-1" />
  </head>
  <body>
    <div id="site-header"></div>
    <main>
      <section class="contact-hero">
        <div class="container">
          <p class="kicker light">CONTACT US · 联系客服</p>
          <h1>告诉我你的问题，<br />一起把体验做得更好</h1>
          <p>无论是网站功能、学习咨询还是资料建议，都可以通过下方表单提交。</p>
        </div>
      </section>

      <section class="section contact-section">
        <div class="container contact-layout">
          <aside class="contact-info-card">
            <p class="kicker">GET IN TOUCH · 联系方式</p>
            <h2>每一条反馈都会被认真阅读</h2>
            <p>请尽量描述发生问题的页面、操作步骤和期望结果，这会帮助我们更快定位问题。</p>
            <div class="contact-email-box">
              <small>客服邮箱</small>
              <strong>dcao1255@gmail.com</strong>
              <button id="copy-contact-email" type="button">复制邮箱</button>
            </div>
            <ul>
              <li>不要提交账号密码或学生隐私资料</li>
              <li>网站问题请附上页面名称与浏览器信息</li>
              <li>提交成功后，客服会尽快查看并回复</li>
            </ul>
          </aside>

          <div class="contact-form-card">
            <p class="kicker">FEEDBACK FORM · 在线反馈</p>
            <h2>提交咨询或建议</h2>
            <form id="contact-form">
              <label for="contact-type">问题类型</label>
              <select id="contact-type" name="type" required>
                <option value="">请选择问题类型</option>
                <option value="网站功能问题">网站功能问题</option>
                <option value="学习咨询">学习咨询</option>
                <option value="资料建议">资料建议</option>
                <option value="内容纠错">内容纠错</option>
                <option value="其他反馈">其他反馈</option>
              </select>

              <div class="contact-field-row">
                <div><label for="contact-name">你的称呼</label><input id="contact-name" name="name" type="text" autocomplete="name" required maxlength="60" /></div>
                <div><label for="contact-email">联系邮箱</label><input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="120" /></div>
              </div>

              <label for="contact-message">问题或建议</label>
              <textarea id="contact-message" name="message" rows="8" required maxlength="3000" placeholder="请描述你遇到的问题、操作步骤或希望增加的功能……"></textarea>
              <input class="contact-honey" name="_honey" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />
              <p class="contact-privacy">提交即表示你同意我们仅将这些信息用于处理本次咨询。</p>
              <button class="button button-yellow button-block" type="submit">发送反馈</button>
              <p class="contact-form-status" id="contact-form-status" role="status"></p>
            </form>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="./assets/js/site-shell.js?v=20260826-1"></script>
    <script src="./assets/js/contact.js?v=20260826-1"></script>
  </body>
</html>
